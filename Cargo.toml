# ============================================================================
# TEMPORARY: polkadot-sdk hotfix redirect (Shibuya/Paseo incident 2026-08-11)
#
# Paseo enabled ExecutorParam::EnabledHostFunction(EccRfc163) (polkadot-sdk
# #11334, landed in stable2603). stable2512 cannot decode variant index 8, so
# every session_executor_params call fails, the collator-protocol never
# populates per_relay_parent, and no collation is ever advertised.
#
# The fork is upstream ba6a0d23259cdc3108f70997a6847e7bc5b28794 (the exact
# commit v5.50.0 was built from) plus patches/0001-executor-params-enabled-
# host-function.patch - decoding only, no runtime or consensus change.
#
# Every polkadot-sdk package in Cargo.lock is redirected, not just
# polkadot-primitives: a partial redirect would resolve the fork's path
# dependencies to a second git source and duplicate sp-*/frame-* crates.
# This also covers the SDK crates pulled in by the frontier and ORML forks.
#
# DELETE this whole section when the workspace moves to stable2603.
# ============================================================================
